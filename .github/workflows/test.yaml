name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.4', '8.5']

    name: PHPUnit on PHP ${{ matrix.php-versions }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpunit

  coverage:
    runs-on: ubuntu-latest
    name: Coverage

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpunit --coverage-text --coverage-clover=clover.xml
      - run: php bin/check-coverage.php clover.xml 90

  static-analysis:
    runs-on: ubuntu-latest
    name: Psalm

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/psalm --shepherd --no-cache

  composer-validate:
    runs-on: ubuntu-latest
    name: Composer validate

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer check-platform-reqs
