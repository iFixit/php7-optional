name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.4', '8.5']

    name: PHPUnit on PHP ${{ matrix.php-versions }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpunit

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Coverage

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpunit --coverage-text --coverage-clover=clover.xml --coverage-xml=coverage-xml --log-junit=junit.xml
      - run: php bin/check-coverage.php clover.xml 100
      - name: Mutation testing
        run: vendor/bin/infection --threads=max --no-progress --coverage=. --skip-initial-tests

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Psalm

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/psalm --shepherd --no-cache

  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: PHPStan

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpstan analyse --no-progress

  # The README says the extension runs on PHPStan 1.12, which reads a
  # conditional return type differently from 2.2 (see AGENTS.md)
  phpstan-1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Extension on PHPStan 1.12

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      # installed on its own, since this project's dev tools need PHPStan 2
      - run: composer global require --no-interaction --no-progress 'phpstan/phpstan:1.12.*'
      - run: PHPSTAN_BINARY="$(composer global config bin-dir --absolute --quiet)/phpstan" vendor/bin/phpunit --filter StaticAnalysisTest

  composer-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Composer validate

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer check-platform-reqs
