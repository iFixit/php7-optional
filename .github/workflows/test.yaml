name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  run:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-versions: [7.4, 8.0, 8.1]

    name: PHP ${{ matrix.php-versions }}

    steps:
      - uses: actions/checkout@v2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: xdebug
          tools: composer:v2
      - name: Install dependencies
        uses: "ramsey/composer-install@v1"
        with:
          composer-options: "${{ matrix.composer-options }}"
      - run: vendor/bin/phpunit --coverage-text

  psalm:
    runs-on: ubuntu-latest

    name: Psalm

    steps:
      - uses: actions/checkout@v2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none
          # Psalm 7 needs a newer PHP than the oldest one we test, so it
          # comes from its phar instead of require-dev.
          tools: composer:v2, psalm:7.4.0
      - name: Install dependencies
        uses: "ramsey/composer-install@v1"
      - run: psalm --shepherd